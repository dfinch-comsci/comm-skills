<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Communication and Digital Skills at Work</title>
<style>
:root{
  --bg:#f3f7fb; --card:#ffffff; --ink:#14213d; --muted:#4a5a73; --line:#cfd9e6;
  --brand:#0b6bcb; --brand-ink:#ffffff; --brand-soft:#e3f0fd;
  --good:#127a3d; --good-soft:#e1f5e8; --bad:#b3261e; --bad-soft:#fde8e6;
  --warn-soft:#fff4d6; --warn:#7a5200; --accent:#7a3fd1; --accent-soft:#efe6fb;
  --fs:20px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1522; --card:#17223a; --ink:#eef3fb; --muted:#b4c2d9; --line:#33456b;
    --brand:#5aaeff; --brand-ink:#08213f; --brand-soft:#1b3557;
    --good:#58d08a; --good-soft:#133a27; --bad:#ff8f86; --bad-soft:#4a1d1a;
    --warn-soft:#41330d; --warn:#ffd77a; --accent:#c7a2ff; --accent-soft:#2f2150;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1522; --card:#17223a; --ink:#eef3fb; --muted:#b4c2d9; --line:#33456b;
  --brand:#5aaeff; --brand-ink:#08213f; --brand-soft:#1b3557;
  --good:#58d08a; --good-soft:#133a27; --bad:#ff8f86; --bad-soft:#4a1d1a;
  --warn-soft:#41330d; --warn:#ffd77a; --accent:#c7a2ff; --accent-soft:#2f2150;
}
:root[data-contrast="high"]{
  --bg:#000; --card:#000; --ink:#fff; --muted:#fff; --line:#fff;
  --brand:#ffe600; --brand-ink:#000; --brand-soft:#1a1a00;
  --good:#3dff7a; --good-soft:#001a09; --bad:#ff6b6b; --bad-soft:#2a0000;
  --warn-soft:#222200; --warn:#ffe600; --accent:#9be7ff; --accent-soft:#001a22;
}
*{box-sizing:border-box}
html{font-size:var(--fs)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,Arial,sans-serif;line-height:1.6}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:4px solid var(--accent);outline-offset:2px}

/* header */
header.top{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:2px solid var(--line)}
.top-row{display:flex;align-items:center;gap:.5rem;padding:.5rem 1rem;max-width:980px;margin:0 auto;flex-wrap:wrap}
.brand{font-weight:800;font-size:1rem;flex:1;min-width:150px}
.tool{min-height:44px;min-width:44px;padding:.2rem .7rem;border:2px solid var(--line);background:var(--card);border-radius:10px;font-weight:700}
.tool:hover{border-color:var(--brand)}
.bar{height:10px;background:var(--line)}
.bar>i{display:block;height:100%;width:0;background:var(--good);transition:width .4s}

main{max-width:820px;margin:0 auto;padding:1rem 1rem 7rem}
.crumb{color:var(--muted);font-weight:700;font-size:.8rem;text-transform:uppercase;letter-spacing:.05em;margin:.5rem 0 0}
h1{font-size:1.7rem;line-height:1.25;margin:.2rem 0 1rem}
h2{font-size:1.3rem;margin:1.5rem 0 .5rem}
.card{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:1.1rem 1.2rem;margin:1rem 0}
.p{display:flex;gap:.6rem;align-items:flex-start;margin:.7rem 0}
.p>span{flex:1}
.say{flex:none;width:40px;height:40px;border-radius:50%;border:2px solid var(--line);background:var(--card);font-size:1rem;padding:0}
.say:hover{border-color:var(--brand)}
.big-emoji{font-size:3rem;line-height:1}
ul.simple{padding-left:1.3rem;margin:.5rem 0}
ul.simple li{margin:.35rem 0}

.note{border-left:8px solid var(--brand);background:var(--brand-soft);padding:.7rem 1rem;border-radius:10px;margin:1rem 0}
.word{border-left:8px solid var(--accent);background:var(--accent-soft)}
.tip{border-left:8px solid var(--warn);background:var(--warn-soft)}
.good{border-left:8px solid var(--good);background:var(--good-soft)}
.bad{border-left:8px solid var(--bad);background:var(--bad-soft)}
.note b.label{display:block;font-size:.8rem;text-transform:uppercase;letter-spacing:.06em}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;min-height:52px;padding:.5rem 1.2rem;border-radius:12px;border:3px solid var(--brand);background:var(--brand);color:var(--brand-ink);font-weight:800}
.btn.alt{background:var(--card);color:var(--ink);border-color:var(--line)}
.btn.alt:hover{border-color:var(--brand)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}

/* nav */
nav.pager{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:2px solid var(--line);z-index:20}
.pager-in{display:flex;gap:.6rem;max-width:820px;margin:0 auto;padding:.6rem 1rem}
.pager-in .btn{flex:1}
.pager-in .mid{flex:1.3}

/* menu */
#menu{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;display:none}
#menu.open{display:block}
#menu .panel{background:var(--card);width:min(420px,92vw);height:100%;overflow:auto;padding:1rem}
#menu h3{margin:.6rem 0 .3rem;font-size:.85rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
#menu button.item{display:flex;width:100%;gap:.6rem;align-items:center;text-align:left;padding:.55rem .6rem;border:2px solid transparent;background:none;border-radius:10px;min-height:48px;font-weight:600}
#menu button.item:hover{background:var(--brand-soft)}
#menu button.item.current{border-color:var(--brand)}
.tick{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none;font-size:.9rem}
.tick.done{background:var(--good);border-color:var(--good);color:#fff}

/* flip cards */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:.8rem}
.flip{background:var(--card);border:3px solid var(--line);border-radius:16px;padding:1rem;text-align:left;min-height:150px;display:flex;flex-direction:column;gap:.3rem}
.flip:hover{border-color:var(--brand)}
.flip .ic{font-size:2.2rem}
.flip .nm{font-weight:800;font-size:1.1rem}
.flip .more{display:none}
.flip.open{border-color:var(--good);background:var(--good-soft)}
.flip.open .more{display:block}
.flip .hint{color:var(--muted);font-size:.8rem}
.flip.open .hint{display:none}

/* quiz */
.q{margin:1.2rem 0}
.q-text{font-weight:800;font-size:1.1rem;margin-bottom:.6rem}
.opts{display:grid;gap:.5rem}
.opt{text-align:left;min-height:56px;padding:.55rem .9rem;border-radius:12px;border:3px solid var(--line);background:var(--card);font-weight:600;display:flex;gap:.6rem;align-items:center}
.opt:hover:not([disabled]){border-color:var(--brand)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt[disabled]{cursor:default}
.fb{margin-top:.6rem}
.scenario{font-size:1.1rem;background:var(--brand-soft);border-radius:12px;padding:.8rem 1rem;margin:.4rem 0 .8rem;font-weight:600}

/* sort */
.pool{display:flex;flex-wrap:wrap;gap:.5rem;min-height:64px;padding:.6rem;border:3px dashed var(--line);border-radius:12px;margin:.5rem 0}
.chip{padding:.45rem .9rem;border-radius:999px;border:3px solid var(--line);background:var(--card);font-weight:700;min-height:48px;text-align:left}
.chip.sel{border-color:var(--accent);background:var(--accent-soft);transform:scale(1.04)}
.chip.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:.7rem}
.bin{border:3px solid var(--line);border-radius:14px;padding:.6rem;background:var(--card);text-align:left;min-height:130px;display:block;width:100%}
.bin:hover{border-color:var(--brand)}
.bin h4{margin:0 0 .4rem;font-size:1rem}
.bin .placed{display:flex;flex-wrap:wrap;gap:.35rem}
.bin .placed span{background:var(--good-soft);border:2px solid var(--good);border-radius:999px;padding:.15rem .65rem;font-size:.85rem;font-weight:600}

/* order */
.ord{display:grid;gap:.5rem;margin:.6rem 0}
.ord-item{display:flex;align-items:center;gap:.5rem;border:3px solid var(--line);border-radius:12px;padding:.4rem .6rem;background:var(--card)}
.ord-item.ok{border-color:var(--good);background:var(--good-soft)}
.ord-item.no{border-color:var(--bad);background:var(--bad-soft)}
.ord-item .t{flex:1;font-weight:600}
.arrow{width:48px;height:48px;border-radius:10px;border:2px solid var(--line);background:var(--card);font-size:1.1rem}
.arrow:hover{border-color:var(--brand)}
.num{width:36px;height:36px;border-radius:50%;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-weight:800;flex:none}

/* email */
.mail{border:2px solid var(--line);border-radius:12px;background:var(--card);overflow:hidden}
.mail-h{background:var(--brand-soft);padding:.5rem .9rem;font-size:.85rem;border-bottom:2px solid var(--line)}
.mail-b{padding:.4rem .9rem}
.hot{display:block;width:100%;text-align:left;background:none;border:3px solid transparent;border-radius:10px;padding:.35rem .6rem;margin:.2rem 0}
.hot:hover{border-color:var(--brand)}
.hot.seen{border-color:var(--good);background:var(--good-soft)}
.hot .tag{display:inline-block;background:var(--brand);color:var(--brand-ink);font-size:.7rem;font-weight:800;border-radius:6px;padding:0 .4rem;margin-right:.4rem}
input[type=text],textarea{width:100%;border:3px solid var(--line);border-radius:12px;padding:.6rem .8rem;background:var(--card);color:var(--ink)}
textarea{min-height:200px;resize:vertical}
label.f{display:block;font-weight:800;margin:.8rem 0 .2rem}
.count{font-weight:800}
.count.ok{color:var(--good)} .count.over{color:var(--bad)}
.checks{list-style:none;padding:0;margin:.6rem 0}
.checks li{display:flex;gap:.6rem;align-items:center;padding:.3rem 0}
.checks .box{width:32px;height:32px;border-radius:8px;border:3px solid var(--line);display:grid;place-items:center;font-weight:800;flex:none;background:var(--card)}
.checks .box.on{background:var(--good);border-color:var(--good);color:#fff}
.checks label{display:flex;gap:.6rem;align-items:center;cursor:pointer}
.checks input[type=checkbox]{width:28px;height:28px;flex:none;accent-color:var(--good)}

.score{font-size:2.4rem;font-weight:900;text-align:center}
.cert{border:6px double var(--brand);border-radius:20px;padding:1.5rem;text-align:center;background:var(--card);margin:1rem 0}
.cert h2{font-size:1.8rem;margin:.2rem 0}
.cert .nm{font-size:2rem;font-weight:900;border-bottom:3px solid var(--line);display:inline-block;min-width:60%;margin:.6rem 0}
footer.credit{max-width:820px;margin:0 auto;padding:0 1rem 7rem;color:var(--muted);font-size:.7rem}
.hide{display:none!important}

@media (max-width:600px){
  header.top{position:static}
  .brand{flex-basis:100%}
  .pager-in .btn{font-size:.8rem;padding:.3rem .4rem}
}
@media print{
  header.top,nav.pager,footer.credit,.noprint,#menu{display:none!important}
  body{background:#fff;color:#000}
  main{padding:0}
  .cert{border-color:#000}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header class="top">
  <div class="top-row">
    <div class="brand">💬 Communication &amp; Digital Skills at Work</div>
    <button class="tool" id="bRead" title="Read this page to me" aria-label="Read this page to me">🔊 Read page</button>
    <button class="tool" id="bSmall" aria-label="Smaller text">A−</button>
    <button class="tool" id="bBig" aria-label="Bigger text">A+</button>
    <button class="tool" id="bContrast" aria-label="Change colours">🎨</button>
    <button class="tool" id="bMenu" aria-label="Open menu">☰ Menu</button>
  </div>
  <div class="bar" role="progressbar" aria-label="Your progress" id="barWrap"><i id="bar"></i></div>
</header>

<div id="menu" aria-label="Lesson menu"><div class="panel" id="menuPanel"></div></div>

<main id="main" tabindex="-1"></main>

<nav class="pager">
  <div class="pager-in">
    <button class="btn alt" id="bBack">◀ Back</button>
    <button class="btn alt mid" id="bStop" title="Stop reading">🔇 Stop voice</button>
    <button class="btn" id="bNext">Next ▶</button>
  </div>
</nav>

<footer class="credit">
  Based on the Barclays LifeSkills lesson “Communication and digital skills at work” (age 16–19). © Barclays 2022.
  This is a self-study version made for classroom use. Brand names are used only as examples.
</footer>

<script>
/* ---------- tiny helpers ---------- */
const $ = s => document.querySelector(s);
function h(tag, props, ...kids){
  const e = document.createElement(tag);
  for(const k in (props||{})){
    const v = props[k];
    if(k==='class') e.className = v;
    else if(k==='html') e.innerHTML = v;
    else if(k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if(v!==false && v!=null) e.setAttribute(k, v===true?'':v);
  }
  kids.flat().forEach(c=>{ if(c==null||c===false) return; e.append(c.nodeType?c:document.createTextNode(c)); });
  return e;
}
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
const store = {
  get(k,d){ try{ const v=localStorage.getItem('csw_'+k); return v==null?d:JSON.parse(v);}catch(e){return d;} },
  set(k,v){ try{ localStorage.setItem('csw_'+k, JSON.stringify(v)); }catch(e){} }
};

/* ---------- read aloud ---------- */
let voiceOn = ('speechSynthesis' in window);
function stopSpeak(){ if(voiceOn) speechSynthesis.cancel(); }
let voices = [];
function loadVoices(){ if(voiceOn) voices = speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang)); }
if(voiceOn){ loadVoices(); speechSynthesis.addEventListener('voiceschanged',()=>{loadVoices(); try{drawMenu();}catch(e){}}); }
function voiceScore(v){
  let s=0;
  if(/natural|neural|premium|enhanced/i.test(v.name)) s+=60;
  if(/online/i.test(v.name)) s+=30;
  if(/^en-GB/i.test(v.lang)) s+=25; else if(/^en-(AU|IE)/i.test(v.lang)) s+=10;
  if(/google uk english|daniel|serena|kate|sonia|libby|ryan|stephanie|arthur|martha|oliver/i.test(v.name)) s+=15;
  if(/compact|espeak|novelty|bad news|bahh|bells|boing|bubbles|cellos|good news|jester|organ|superstar|trinoids|whisper|wobble|zarvox|albert|fred|junior|ralph|kathy/i.test(v.name)) s-=100;
  return s;
}
function bestVoice(){
  const saved = store.get('voice',null);
  if(saved){ const v=voices.find(x=>x.name===saved); if(v) return v; }
  return voices.slice().sort((a,b)=>voiceScore(b)-voiceScore(a))[0] || null;
}
function speak(text){
  if(!voiceOn) return alert('Sorry, reading aloud does not work in this browser.');
  speechSynthesis.cancel();
  const v = bestVoice(), rate = store.get('rate',0.9);
  // read one sentence at a time: sounds more natural and avoids cut-offs in long text
  const parts = text.replace(/\s+/g,' ').trim().match(/[^.!?:]+[.!?:]*/g) || [text];
  parts.forEach(t=>{
    if(!t.trim()) return;
    const u = new SpeechSynthesisUtterance(t.trim());
    u.lang = v?v.lang:'en-GB'; if(v) u.voice=v;
    u.rate = rate; u.pitch = 1;
    speechSynthesis.speak(u);
  });
}

/* ---------- reusable building blocks ---------- */
function P(text){ // paragraph with a speaker button
  return h('div',{class:'p'}, h('span',{html:text}),
    h('button',{class:'say noprint','aria-label':'Read this out loud',onclick:()=>speak(text.replace(/<[^>]+>/g,''))},'🔊'));
}
function note(kind,label,html){ return h('div',{class:'note '+kind}, h('b',{class:'label'},label), h('span',{html})); }
function wordBox(term,meaning){ return note('word','📖 Word to know', `<b>${term}</b> means: ${meaning}`); }

/* activity tracking per page */
let ctx = null;
function newCtx(pageId){
  ctx = { id:pageId, total:0, done:0, check(){ if(this.total>0 && this.done>=this.total){ markDone(pageId);} } };
  return ctx;
}
function register(){
  const c = ctx; c.total++;
  let fired=false;
  return ()=>{ if(fired) return; fired=true; c.done++; c.check(); };
}

/* flip cards */
function flipCards(items, onAll){
  const done = register(); const seen = new Set();
  const g = h('div',{class:'grid'});
  items.forEach((it,i)=>{
    const b = h('button',{class:'flip','aria-expanded':'false'},
      h('div',{class:'ic'},it.icon), h('div',{class:'nm'},it.name),
      h('div',{class:'hint'},'👆 Tap to find out more'),
      h('div',{class:'more',html:it.more}));
    b.addEventListener('click',()=>{
      const open = b.classList.toggle('open'); b.setAttribute('aria-expanded',open);
      if(open){ seen.add(i); speak(it.name+'. '+it.more.replace(/<[^>]+>/g,' ')); }
      if(seen.size===items.length) done();
    });
    g.append(b);
  });
  return g;
}

/* multiple choice */
function quiz(q, onDone){
  const done = register();
  const wrap = h('div',{class:'q'});
  wrap.append(h('div',{class:'q-text'},q.text));
  if(q.scenario) wrap.insertBefore(h('div',{class:'scenario'},q.scenario), wrap.firstChild);
  const opts = h('div',{class:'opts'});
  const fb = h('div',{class:'fb',role:'status','aria-live':'polite'});
  const right = Array.isArray(q.correct)?q.correct:[q.correct];
  let finished=false;
  (q.shuffle===false?q.options:shuffle(q.options.map((o,i)=>({o,i})))).forEach(x=>{
    const text = x.o||x, idx = x.i!==undefined?x.i:q.options.indexOf(x);
    const b = h('button',{class:'opt'}, text);
    b.addEventListener('click',()=>{
      if(finished) return;
      if(right.includes(idx)){
        finished=true; b.classList.add('right'); b.prepend('✅ ');
        opts.querySelectorAll('button').forEach(o=>o.disabled=true);
        fb.replaceChildren(note('good','✅ Well done', (q.hints&&q.hints[idx]) || q.explain || 'That is right.'));
        if(onDone) onDone(true); done();
      } else {
        b.classList.add('wrong'); b.disabled=true; b.prepend('❌ ');
        fb.replaceChildren(note('bad','❌ Not quite', (q.hints&&q.hints[idx]) || 'Have another go. Use the clue if you need help.'));
      }
    });
    opts.append(b);
  });
  wrap.append(opts);
  if(q.clues){
    const c = h('div',{class:'hide'}); c.append(note('tip','💡 Clues','<ul class="simple">'+q.clues.map(t=>`<li>${t}</li>`).join('')+'</ul>'));
    wrap.append(h('button',{class:'btn alt',style:'margin-top:.6rem',onclick:e=>{c.classList.toggle('hide'); e.target.textContent=c.classList.contains('hide')?'💡 Show a clue':'💡 Hide the clue';}},'💡 Show a clue'), c);
  }
  wrap.append(fb);
  return wrap;
}

/* sort into bins: tap an item, then tap a box */
function sorter(items, bins, intro){
  const done = register();
  let selected=null, left=items.length;
  const pool = h('div',{class:'pool'});
  const msg = h('div',{role:'status','aria-live':'polite'});
  const binEls = bins.map((b,bi)=>{
    const placed = h('div',{class:'placed'});
    const el = h('button',{class:'bin'}, h('h4',{},b.icon+' '+b.name), placed);
    el.addEventListener('click',()=>{
      if(!selected) { msg.replaceChildren(note('tip','👆 First','Tap one of the words above. Then tap the box where it goes.')); return; }
      const it = selected.item;
      if(it.bin===bi){
        placed.append(h('span',{},it.text)); selected.el.remove(); selected=null; left--;
        msg.replaceChildren(note('good','✅ Yes!', it.why||'Right box.'));
        if(left===0){ msg.replaceChildren(note('good','🎉 All done','You put every one in the right box.')); done(); }
      } else {
        selected.el.classList.add('shake'); setTimeout(()=>selected&&selected.el.classList.remove('shake'),400);
        msg.replaceChildren(note('bad','❌ Not that box', 'Think again, then tap a different box.'));
      }
    });
    return el;
  });
  shuffle(items).forEach(it=>{
    const c = h('button',{class:'chip'},it.text);
    c.addEventListener('click',()=>{
      if(selected) selected.el.classList.remove('sel');
      selected={item:it,el:c}; c.classList.add('sel');
      msg.replaceChildren(note('word','👉 Now', `Tap the box where “${it.text}” goes.`));
    });
    pool.append(c);
  });
  return h('div',{}, intro?P(intro):null, pool, h('div',{class:'bins'},binEls), msg);
}

/* put in order with up/down arrows */
function orderer(items){
  const done = register();
  let list = shuffle(items.map((t,i)=>({t,i})));
  if(list.every((x,i)=>x.i===i)) list.reverse();
  const box = h('div',{class:'ord'}); const msg = h('div',{role:'status','aria-live':'polite'});
  function draw(res){
    box.replaceChildren(...list.map((x,pos)=>h('div',{class:'ord-item '+(res?(x.i===pos?'ok':'no'):'')},
      h('div',{class:'num'},pos+1), h('div',{class:'t'},x.t),
      h('button',{class:'arrow','aria-label':'Move up',disabled:pos===0,onclick:()=>{[list[pos-1],list[pos]]=[list[pos],list[pos-1]];draw();}},'▲'),
      h('button',{class:'arrow','aria-label':'Move down',disabled:pos===list.length-1,onclick:()=>{[list[pos+1],list[pos]]=[list[pos],list[pos+1]];draw();}},'▼'))));
  }
  draw();
  const check = h('button',{class:'btn',onclick:()=>{
    draw(true);
    if(list.every((x,i)=>x.i===i)){ msg.replaceChildren(note('good','🎉 Perfect','That is the right order.')); done(); }
    else msg.replaceChildren(note('bad','Nearly','Green ones are right. Red ones are in the wrong place. Move them and press Check again.'));
  }},'✔ Check my order');
  return h('div',{},box,check,msg);
}

/* checklist with tick boxes (manual) */
function checklist(items, onChange, key){
  const saved = store.get(key,[]);
  const ul = h('ul',{class:'checks'});
  const inputs = items.map((t,i)=>{
    const cb = h('input',{type:'checkbox'}); cb.checked = !!saved[i];
    cb.addEventListener('change',()=>{ store.set(key, inputs.map(x=>x.checked)); onChange&&onChange(); });
    ul.append(h('li',{}, h('label',{}, cb, h('span',{},t))));
    return cb;
  });
  ul.all = ()=>inputs.every(i=>i.checked);
  return ul;
}

page({id:'writemail',part:'Part 1: Talking at work',title:'Write your own job email',icon:'✍️',render(el){
  const done = register();
  const subj = h('input',{type:'text',placeholder:'Example: Admin Assistant job (ref: ABC123)','aria-label':'Subject'});
  const body = h('textarea',{placeholder:'Dear …','aria-label':'Email'});
  subj.value = store.get('mailSubj',''); body.value = store.get('mailBody','');
  const count = h('div',{class:'count'});
  const list = h('ul',{class:'checks'});
  const manual = checklist(['I said <b>why</b> I want the job','I wrote about my <b>skills or experience</b>'].map(x=>x.replace(/<\/?b>/g,'')), update, 'mailManual');
  const RUDE = /\b(lol|hey|yo|mate|omg|thx|u|ur|gonna|wanna)\b|!!|xx/i;
  function words(t){ const m=t.trim().match(/\S+/g); return m?m.length:0; }
  function row(ok,text){ return h('li',{}, h('span',{class:'box '+(ok?'on':'')},ok?'✓':''), h('span',{},text)); }
  function update(){
    store.set('mailSubj',subj.value); store.set('mailBody',body.value);
    const t = body.value, n = words(t);
    count.textContent = `${n} words (aim for 60 to 80)`;
    count.className = 'count '+(n>=60&&n<=80?'ok':(n>80?'over':''));
    const checks = [
      [subj.value.trim().length>3,'I wrote a <b>subject</b>'],
      [/^\s*dear\s+\S+/i.test(t),'I started with <b>“Dear …”</b>'],
      [/(yours\s+(sincerely|faithfully)|kind regards|best wishes)\s*,?/i.test(t),'I ended with <b>“Yours sincerely”</b> (or similar) and my name'],
      [n>=60&&n<=80,'It is <b>60 to 80 words</b>'],
      [!RUDE.test(t)&&t.trim().length>0,'It sounds <b>professional</b> (no slang)'],
      [/\b(attach|attached|cv|resume)\b/i.test(t),'I mentioned my <b>attached CV</b>'],
    ];
    list.replaceChildren(...checks.map(c=>{const li=row(c[0],'');li.lastChild.innerHTML=c[1];return li;}));
    if(checks.every(c=>c[0]) && manual.all()) { done(); finish.classList.remove('hide'); }
  }
  const finish = h('div',{class:'hide'}, note('good','🎉 Brilliant','Your email has everything an employer wants to see.'));
  const help = h('div',{class:'hide'}, note('tip','💡 Sentence starters',
    '<ul class="simple"><li>Dear Mr / Ms (name),</li><li>I am writing to apply for the (job name) job. I saw it on your website.</li><li>I think I would be good at this job because …</li><li>I have experience of … / I am good at …</li><li>I can start …</li><li>Thank you for your time. I have attached my CV.</li><li>Yours sincerely, (your name)</li></ul>'));
  const model = h('div',{class:'hide'}, note('word','📧 Example from Kelli','Dear Michael,<br>I am writing to apply for the above position having read the advertisement on your website. I believe spending this summer as a Junior Coordinator for the Sanford Festival, along with my eye for detail, makes me well suited to the role. I am available to start immediately.<br>Many thanks in advance for taking the time to consider my attached CV.<br>Yours sincerely,<br>Kelli Fliss'));
  [subj,body].forEach(x=>x.addEventListener('input',update));
  el.append(
    P('Choose a job you like. Write a <b>60 to 80 word email</b> to the employer. Say why you want the job.'),
    note('tip','Think about','An email to an employer is <b>different</b> from an email to a friend. Think about your tone. Think about how you start and end.'),
    h('label',{class:'f'},'Subject'), subj,
    h('label',{class:'f'},'Your email'), body, count,
    h('div',{class:'row',style:'margin:.6rem 0'},
      h('button',{class:'btn alt',onclick:()=>help.classList.toggle('hide')},'💡 Help me start'),
      h('button',{class:'btn alt',onclick:()=>model.classList.toggle('hide')},'📧 Show an example')),
    help, model,
    h('h2',{},'✅ Check your email'), list,
    P('Tick these two yourself:'), manual, finish,
    note('','💾','Your writing is saved on this computer. You can come back to it later.')
  );
  update();
}});

/* 14 final quiz */
const FINAL = [
  {text:'You need a short, quick, relaxed chat with a colleague. What is best?',options:['Instant messenger','A long report','A blog'],correct:0},
  {text:'How should a job email start?',options:['Hey!','Dear Ms Patel,','Yo mate'],correct:1},

  {text:'Which of these is best for sharing hard-to-explain information when you cannot meet?',options:['Video','A text','A tweet'],correct:0},
  {text:'What does “collaboration” mean?',options:['Working alone','Working together for the same goal','Giving orders'],correct:1},
  {text:'Which tool is an ideas board for sticky notes?',options:['Padlet','Skype','Slido'],correct:0},
  {text:'What is good about a shared online document?',options:['Everyone has their own copy','Only one copy, so everyone sees the latest','It never needs the internet'],correct:1},

page({id:'final',part:'Finish',title:'Final quiz',icon:'🎓',render(el){
  const done = register();
  let right=0, answered=0;
  const score = h('div',{class:'score',role:'status','aria-live':'polite'},'');
  el.append(P('Last part! Answer all <b>10 questions</b>. Your score shows at the bottom.'));
  FINAL.forEach((q,i)=>{
    el.append(h('div',{class:'card'}, h('div',{class:'crumb'},`Question ${i+1} of ${FINAL.length}`),
      quiz({...q,shuffle:false,explain:'Yes, that is right.'}, ()=>{ right++; answered++; upd(); })));
  });
  // count wrong-first attempts too: quiz completes only on correct, so score = first-try correct
  function upd(){
    if(answered===FINAL.length){
      score.textContent = `🎉 You answered all ${FINAL.length} questions!`;
      done();
    }
  }
  el.append(score);
}});

/* ---------- app shell ---------- */
let progress = store.get('progress',{});
let cur = Math.min(store.get('page',0), PAGES.length-1);

function markDone(id){
  if(!progress[id]){ progress[id]=true; store.set('progress',progress); updateBar(); drawMenu(); }
}
function updateBar(){
  const n = PAGES.filter(p=>progress[p.id]).length;
  const pct = Math.round(n/PAGES.length*100);
  $('#bar').style.width = pct+'%';
  $('#barWrap').setAttribute('aria-valuenow',pct); $('#barWrap').setAttribute('aria-valuemin',0); $('#barWrap').setAttribute('aria-valuemax',100);
}
function go(i){
  stopSpeak();
  cur = Math.max(0,Math.min(PAGES.length-1,i));
  store.set('page',cur);
  const p = PAGES[cur], m = $('#main');
  m.replaceChildren();
  const c = newCtx(p.id);
  m.append(h('div',{class:'crumb'},`${p.part} · Page ${cur+1} of ${PAGES.length}`), h('h1',{},p.icon+' '+p.title));
  p.render(m);
  if(c.total===0) markDone(p.id); // pages with no activity count when visited
  $('#bBack').disabled = cur===0;
  const last = cur===PAGES.length-1;
  $('#bNext').disabled = last;
  $('#bNext').textContent = last?'The end':'Next ▶';
  drawMenu(); updateBar();
  window.scrollTo(0,0); m.focus({preventScroll:true});
  document.title = p.title+' – Communication and Digital Skills at Work';
}
function drawMenu(){
  const panel = $('#menuPanel'); panel.replaceChildren(
    h('div',{class:'row',style:'justify-content:space-between'},h('b',{},'📚 Lesson menu'),h('button',{class:'tool',onclick:()=>$('#menu').classList.remove('open')},'✖ Close')));
  if(voiceOn && voices.length){
    const cur = bestVoice();
    const sel = h('select',{'aria-label':'Choose a voice',style:'width:100%;min-height:48px;border:3px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);padding:.3rem'},
      voices.slice().sort((a,b)=>voiceScore(b)-voiceScore(a)).map(v=>h('option',{value:v.name,selected:cur&&cur.name===v.name},v.name+' ('+v.lang+')')));
    sel.addEventListener('change',()=>{store.set('voice',sel.value);speak('Hello! This is how I sound.');});
    const rate = h('select',{'aria-label':'Voice speed',style:'width:100%;min-height:48px;border:3px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);padding:.3rem'},
      [[0.75,'Slow'],[0.9,'Normal'],[1.05,'Fast']].map(r=>h('option',{value:r[0],selected:store.get('rate',0.9)===r[0]},r[1])));
    rate.addEventListener('change',()=>{store.set('rate',parseFloat(rate.value));speak('Hello! This is how fast I read.');});
    panel.append(h('h3',{},'🔊 Voice'), sel, h('div',{style:'height:.4rem'}), rate,
      h('p',{style:'font-size:.75rem;color:var(--muted)'},'Tip: voices marked “Natural” or “Online” sound best. Try Microsoft Edge on Windows, or download an “Enhanced” voice on a Mac.'));
  }
  let last='';
  PAGES.forEach((p,i)=>{
    if(p.part!==last){ panel.append(h('h3',{},p.part)); last=p.part; }
    panel.append(h('button',{class:'item'+(i===cur?' current':''),onclick:()=>{$('#menu').classList.remove('open');go(i);}},
      h('span',{class:'tick'+(progress[p.id]?' done':'')},progress[p.id]?'✓':''), p.icon+' '+p.title));
  });
}

/* controls */
$('#bNext').onclick=()=>go(cur+1);
$('#bBack').onclick=()=>go(cur-1);
$('#bStop').onclick=stopSpeak;
$('#bMenu').onclick=()=>$('#menu').classList.add('open');
$('#menu').addEventListener('click',e=>{ if(e.target.id==='menu') $('#menu').classList.remove('open'); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape') $('#menu').classList.remove('open'); });
$('#bRead').onclick=()=>{
  const m = $('#main').cloneNode(true);
  m.querySelectorAll('button.say,button.btn,input,textarea,.opts,.pool,.bins,.ord,.checks').forEach(x=>x.remove());
  speak(m.innerText.replace(/\s+/g,' '));
};
let fs = store.get('fs',20);
function setFs(v){ fs=Math.max(16,Math.min(32,v)); document.documentElement.style.setProperty('--fs',fs+'px'); store.set('fs',fs); }
$('#bBig').onclick=()=>setFs(fs+2); $('#bSmall').onclick=()=>setFs(fs-2); setFs(fs);
let contrast = store.get('contrast',false);
function setContrast(v){ contrast=v; if(v) document.documentElement.dataset.contrast='high'; else delete document.documentElement.dataset.contrast; store.set('contrast',v); }
$('#bContrast').onclick=()=>setContrast(!contrast); setContrast(contrast);
if(!voiceOn){ $('#bRead').classList.add('hide'); $('#bStop').classList.add('hide'); }

go(cur);
</script>
